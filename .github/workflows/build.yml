name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev xvfb
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/check-release.cjs
      - run: npm ci
      - run: npm run build:ui
      - run: node tools/verify-ui.cjs
      - run: node --test tools/test-search.cjs tools/test-images.cjs tools/test-markdown-keys.cjs
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: Test Linux startup
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          export MARKORA_DATA_DIR="$RUNNER_TEMP/markora-smoke"
          set +e
          xvfb-run -a timeout 10s target/debug/markora
          status=$?
          set -e
          # A healthy desktop app stays open until the timeout ends it.
          test "$status" -eq 124
      - run: cargo build --release --locked
      - name: Collect dependency licenses
        run: node tools/collect-licenses.cjs
      - name: Package binary
        run: ./tools/package-release.ps1
      - name: Upload binary and checksum
        uses: actions/upload-artifact@v7
        with:
          name: markora-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: markora-*
          path: dist
          merge-multiple: true
      - name: Create release and upload downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=(--generate-notes --verify-tag)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${options[@]}" --title "Markora $RELEASE_TAG"
          fi
